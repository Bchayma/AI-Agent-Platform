version: "3.9"

services:

  backend:
    build: ./backend
    container_name: agent-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app          # hot-reload in dev
      - db_data:/app/data       # persist SQLite
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/platform.db
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: agent-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
